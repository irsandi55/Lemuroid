name: Build GBA Memory Search APK

on:
  push:
    branches:
      - feature/gba-memory-search
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          ref: feature/gba-memory-search
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build bundled free debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleFreeBundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-gba-memory-search-debug
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/lemuroid-app-free-bundle-debug.apk
          if-no-files-found: error
          retention-days: 14
